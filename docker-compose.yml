# @format

networks:
 openemr-net:
  driver: bridge

services:
 mysql:
  image: mariadb:10.11
  command: --key-buffer-size=16M --max-allowed-packet=64M --table-open-cache=512 --sort-buffer-size=4M --read-buffer-size=2M --read-rnd-buffer-size=2M --myisam-sort-buffer-size=64M --thread-cache-size=8 --query-cache-size=16M --query-cache-limit=2M --ft-min-word-len=4 --default-storage-engine=InnoDB --transaction-isolation=READ-COMMITTED --max-connections=150
  networks:
   - openemr-net
  volumes:
   - db_data:/var/lib/mysql
  environment:
   MYSQL_ROOT_PASSWORD: root
   MYSQL_USER: openemr
   MYSQL_PASSWORD: pass
  healthcheck:
   test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
   interval: 5s
   timeout: 5s
   retries: 10

 openemr:
  image: openemr/openemr:latest
  ports:
   - "8400:80"
   - "8401:443"
  networks:
   - openemr-net
  volumes:
   - log_data:/var/log
   - site_data:/var/www/localhost/htdocs/openemr/sites
  environment:
   MYSQL_HOST: mysql
   MYSQL_ROOT_PASSWORD: root
   MYSQL_USER: openemr
   MYSQL_PASSWORD: pass
   MYSQL_DATABASE: openemr
   OE_USER: admin
   OE_PASS: pass
  depends_on:
   mysql:
    condition: service_healthy

volumes:
 db_data:
 log_data:
 site_data:
