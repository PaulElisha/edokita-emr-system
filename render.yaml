# @format
# Render Blueprint for the OpenEMR app service, backed by the existing Aiven MySQL.
# Sync via Render Dashboard > New > Blueprint, pointing at this repo/branch.
#
# Notes:
# - OpenEMR image reads MYSQL_ROOT_PASS / MYSQL_PASS (NOT the docker-compose *_PASSWORD names).
# - The Aiven project CA is placed on the disk at
#   sites/default/documents/certificates/mysql-ca so OpenEMR connects over TLS.
#   Add the CA as a Render Secret File named mysql-ca (content of certs/ca.pem).
# - We build deploy/openemr/Dockerfile rather than the plain image: Render disks
#   start empty, so we seed sites/ from the image's pristine defaults or the
#   entrypoint dies with "Cannot upgrade - OpenEMR is not configured yet".
# - Secrets are marked sync:false -> set their real values in the Render Dashboard.

services:
  - type: web
    name: openemr
    runtime: docker
    dockerfilePath: ./deploy/openemr/Dockerfile
    dockerContext: ./
    region: oregon
    plan: 1c-2g
    healthCheckPath: /interface/login/login.php
    envVars:
      - key: MYSQL_HOST
        value: mysql-1bc79121-ireajao-9f74.j.aivencloud.com
      - key: MYSQL_PORT
        value: "25562"
      - key: MYSQL_ROOT_USER
        value: avnadmin
      - key: MYSQL_ROOT_PASS
        sync: false
      - key: MYSQL_USER
        value: openemr
      - key: MYSQL_PASS
        sync: false
      - key: MYSQL_DATABASE
        value: openemr
      - key: OE_USER
        value: admin
      - key: OE_PASS
        sync: false
    disk:
      name: openemr-sites
      mountPath: /var/www/localhost/htdocs/openemr/sites
      sizeGB: 10

